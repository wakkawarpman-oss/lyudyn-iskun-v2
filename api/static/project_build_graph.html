        { from: 'c_redis', to: 'c_web_api', label: 'Fast Read' },
        { from: 'c_redis', to: 'c_bot_ui', label: 'Broadcast Queue' },

        // Containers to Clients
        { from: 'c_web_api', to: 'cl_web_map', label: 'HTTP REST / JSON' },
        { from: 'c_web_api', to: 'cl_atak_cot', label: 'XML CoT 2.0' },
        { from: 'c_web_api', to: 'cl_atak_zip', label: 'Mission Zip' },
        { from: 'c_web_api', to: 'cl_open_webui', label: 'Tool Manifest' },
        { from: 'c_bot_ui', to: 'cl_telegram_bot', label: 'Aiogram Polling' },
        { from: 'c_bot_ui', to: 'cl_admin_alert', label: 'Health Alerts' },

        // Ingress & Tunnel
        { from: 'c_cloudflared', to: 'c_web_api', label: 'Zero-Trust Proxy' }
      ]
    };

    // 2. CANVAS ENGINE (Force-directed physics & interactive rendering)
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.parentElement.clientWidth;
      height = canvas.parentElement.clientHeight;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resize);
    resize();

    // Layout Initializer
    const nodes = graphData.nodes;
    const edges = graphData.edges;

    const groupCenters = {
      sensor: { x: width * 0.15, y: height * 0.3 },
      container: { x: width * 0.45, y: height * 0.35 },
      engine: { x: width * 0.50, y: height * 0.70 },
      storage: { x: width * 0.25, y: height * 0.65 },
      client: { x: width * 0.82, y: height * 0.45 }
    };

    nodes.forEach((n, idx) => {
      const c = groupCenters[n.group] || { x: width / 2, y: height / 2 };
      n.x = c.x + (Math.random() - 0.5) * 160;
      n.y = c.y + (Math.random() - 0.5) * 160;
      n.vx = 0;
      n.vy = 0;
      n.radius = n.group === 'container' ? 24 : 18;
      n.visible = true;
    });

    // Camera State
    let camX = 0, camY = 0, zoom = 1.0;
    let isDragging = false, lastMouseX = 0, lastMouseY = 0;
    let draggedNode = null;
    let hoveredNode = null;
    let selectedNode = null;
    let physicsRunning = true;

    // Simulation loop
    function updatePhysics() {
      if (!physicsRunning) return;

      // Spring forces for edges
      edges.forEach(e => {
        const source = nodes.find(n => n.id === e.from);
        const target = nodes.find(n => n.id === e.to);
        if (!source || !target || !source.visible || !target.visible) return;

        const dx = target.x - source.x;
        const dy = target.y - source.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const targetDist = 130;
        const force = (dist - targetDist) * 0.008;

        const fx = (dx / dist) * force;
        const fy = (dy / dist) * force;

        source.vx += fx;
        source.vy += fy;
        target.vx -= fx;
        target.vy -= fy;
      });

      // Repulsion between all nodes
      for (let i = 0; i < nodes.length; i++) {
        const n1 = nodes[i];
        if (!n1.visible) continue;

        for (let j = i + 1; j < nodes.length; j++) {
          const n2 = nodes[j];
          if (!n2.visible) continue;

          const dx = n2.x - n1.x;
          const dy = n2.y - n1.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          if (dist < 260) {
            const force = (260 - dist) / dist * 0.45;
            n1.vx -= (dx / dist) * force;
            n1.vy -= (dy / dist) * force;
            n2.vx += (dx / dist) * force;
            n2.vy += (dy / dist) * force;
          }
        }

        // Center gravitation towards group home
        const center = groupCenters[n1.group] || { x: width / 2, y: height / 2 };
        n1.vx += (center.x - n1.x) * 0.004;
        n1.vy += (center.y - n1.y) * 0.004;

        // Apply velocity with damping
        if (n1 !== draggedNode) {
          n1.vx *= 0.82;
          n1.vy *= 0.82;
          n1.x += n1.vx;
          n1.y += n1.vy;
        }
      }
    }

    // Render loop
    function render() {
      ctx.clearRect(0, 0, width, height);

      ctx.save();
      ctx.translate(camX, camY);
      ctx.scale(zoom, zoom);

      // 1. Draw Group Region Backgrounds
      Object.entries(groupCenters).forEach(([grp, pt]) => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 160, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.015)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.stroke();
      });

      // 2. Draw Edges
      edges.forEach(e => {
        const source = nodes.find(n => n.id === e.from);
        const target = nodes.find(n => n.id === e.to);
        if (!source || !target || !source.visible || !target.visible) return;

        const isHighlighted = (selectedNode && (selectedNode.id === source.id || selectedNode.id === target.id)) ||
                              (hoveredNode && (hoveredNode.id === source.id || hoveredNode.id === target.id));

        ctx.beginPath();
        ctx.moveTo(source.x, source.y);
        ctx.lineTo(target.x, target.y);
        ctx.strokeStyle = isHighlighted ? '#10b981' : 'rgba(100, 116, 139, 0.25)';
        ctx.lineWidth = isHighlighted ? 2.5 : 1.2;
        ctx.stroke();

        // Edge Label (if highlighted)
        if (isHighlighted && e.label) {
          const midX = (source.x + target.x) / 2;
          const midY = (source.y + target.y) / 2;
          ctx.font = '9px monospace';
          ctx.fillStyle = '#34d399';
          ctx.fillText(e.label, midX + 5, midY - 3);
        }
      });

      // 3. Draw Nodes
      nodes.forEach(n => {
        if (!n.visible) return;

        const isSelected = selectedNode && selectedNode.id === n.id;
        const isHovered = hoveredNode && hoveredNode.id === n.id;

        // Outer glow
        if (isSelected || isHovered) {
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.radius + 8, 0, Math.PI * 2);
          ctx.fillStyle = n.color + '33';
          ctx.fill();
        }

        // Main Node Body
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
        ctx.fillStyle = n.color;
        ctx.fill();
        ctx.strokeStyle = isSelected ? '#ffffff' : 'rgba(255,255,255,0.4)';
        ctx.lineWidth = isSelected ? 3 : 1.5;
        ctx.stroke();

        // Icon inside node
        ctx.font = `${Math.floor(n.radius * 0.9)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(n.icon, n.x, n.y);

        // Node Label
        ctx.font = isSelected ? 'bold 12px sans-serif' : '11px sans-serif';
        ctx.fillStyle = isSelected ? '#ffffff' : '#cbd5e1';
        ctx.textAlign = 'center';
        ctx.fillText(n.label, n.x, n.y + n.radius + 14);

        // Tech tag under label
        if (n.tech && (isSelected || isHovered || zoom > 0.9)) {
          ctx.font = '9px monospace';
          ctx.fillStyle = '#94a3b8';
          ctx.fillText(n.tech, n.x, n.y + n.radius + 26);
        }
      });

      ctx.restore();

      updatePhysics();
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // 3. INTERACTION & EVENT LISTENERS
    function screenToWorld(sx, sy) {
      return {
        x: (sx - camX) / zoom,
        y: (sy - camY) / zoom
      };
    }

    function getNodeAt(x, y) {
      for (let i = nodes.length - 1; i >= 0; i--) {
        const n = nodes[i];
        if (!n.visible) continue;
        const dx = x - n.x;
        const dy = y - n.y;
        if (dx * dx + dy * dy <= (n.radius + 6) * (n.radius + 6)) {
          return n;
        }
      }
      return null;
    }

    canvas.addEventListener('mousedown', e => {
      const pos = screenToWorld(e.clientX, e.clientY - 56);
      const hit = getNodeAt(pos.x, pos.y);
      if (hit) {
        draggedNode = hit;
        selectNode(hit);
      } else {
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      }
    });

    window.addEventListener('mousemove', e => {
      if (draggedNode) {
        const pos = screenToWorld(e.clientX, e.clientY - 56);
        draggedNode.x = pos.x;
        draggedNode.y = pos.y;
        draggedNode.vx = 0;
        draggedNode.vy = 0;
      } else if (isDragging) {
        camX += e.clientX - lastMouseX;
        camY += e.clientY - lastMouseY;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      } else {
        const pos = screenToWorld(e.clientX, e.clientY - 56);
        hoveredNode = getNodeAt(pos.x, pos.y);
        canvas.style.cursor = hoveredNode ? 'pointer' : (isDragging ? 'grabbing' : 'grab');
      }
    });

    window.addEventListener('mouseup', () => {
      draggedNode = null;
      isDragging = false;
    });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const mousePos = { x: e.clientX, y: e.clientY - 56 };
      
      camX = mousePos.x - (mousePos.x - camX) * zoomFactor;
      camY = mousePos.y - (mousePos.y - camY) * zoomFactor;
      zoom *= zoomFactor;
      zoom = Math.max(0.3, Math.min(3.0, zoom));
    });

    // Touch event listeners for mobile / tablet
    let initialPinchDist = null;
    let initialPinchZoom = 1;

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (e.touches.length === 1) {
        const touch = e.touches[0];
        const pos = screenToWorld(touch.clientX, touch.clientY - 56);
        const hit = getNodeAt(pos.x, pos.y);
        if (hit) {
          draggedNode = hit;
          selectNode(hit);
        } else {
          isDragging = true;
          lastMouseX = touch.clientX;
          lastMouseY = touch.clientY;
        }
      } else if (e.touches.length === 2) {
        isDragging = false;
        draggedNode = null;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        initialPinchDist = Math.hypot(dx, dy);
        initialPinchZoom = zoom;
      }
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      if (e.touches.length === 1) {
        const touch = e.touches[0];
        if (draggedNode) {
          const pos = screenToWorld(touch.clientX, touch.clientY - 56);
          draggedNode.x = pos.x;
          draggedNode.y = pos.y;
          draggedNode.vx = 0;
          draggedNode.vy = 0;
        } else if (isDragging) {
          camX += touch.clientX - lastMouseX;
          camY += touch.clientY - lastMouseY;
          lastMouseX = touch.clientX;
          lastMouseY = touch.clientY;
        }
      } else if (e.touches.length === 2 && initialPinchDist) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        if (dist > 10) {
          const factor = dist / initialPinchDist;
          zoom = Math.max(0.3, Math.min(3.0, initialPinchZoom * factor));
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', e => {
      if (e.touches.length === 0) {
        draggedNode = null;
        isDragging = false;
        initialPinchDist = null;
      } else if (e.touches.length === 1) {
        initialPinchDist = null;
        const touch = e.touches[0];
        lastMouseX = touch.clientX;
        lastMouseY = touch.clientY;
        isDragging = true;
      }
    });

    // 4. INSPECTOR PANEL CONTROLLER
    function selectNode(n) {
      selectedNode = n;
      document.getElementById('insp-icon').textContent = n.icon;
      document.getElementById('insp-title').textContent = n.label;
      document.getElementById('insp-desc').textContent = n.desc;
      document.getElementById('insp-tech').textContent = n.tech;
      document.getElementById('insp-sla').textContent = n.sla;
      
      const badge = document.getElementById('insp-badge');
      badge.textContent = n.group.toUpperCase();
      badge.style.color = n.color;
      badge.style.borderColor = n.color + '66';

      // Inputs
      const inEdges = edges.filter(e => e.to === n.id);
      const inContainer = document.getElementById('insp-inputs');
      inContainer.innerHTML = inEdges.length ? inEdges.map(e => {
        const fromNode = nodes.find(x => x.id === e.from);
        return `<span class="bg-[#1e293b] border border-slate-700 px-2 py-0.5 rounded text-[10px] text-slate-300">⬅️ ${fromNode ? fromNode.label : e.from}</span>`;
      }).join('') : '<span class="text-slate-500 italic text-[11px]">Немає прямих вхідних залежностей</span>';

      // Outputs
      const outEdges = edges.filter(e => e.from === n.id);
      const outContainer = document.getElementById('insp-outputs');
      outContainer.innerHTML = outEdges.length ? outEdges.map(e => {
        const toNode = nodes.find(x => x.id === e.to);
        return `<span class="bg-[#1e293b] border border-slate-700 px-2 py-0.5 rounded text-[10px] text-slate-300">➡️ ${toNode ? toNode.label : e.to}</span>`;
      }).join('') : '<span class="text-slate-500 italic text-[11px]">Кінцева точка видачі</span>';

      // Metrics
      const mContainer = document.getElementById('insp-metrics');
      mContainer.innerHTML = (n.metrics || []).map(m => `
        <div class="flex items-center space-x-1.5 text-slate-300">
          <span class="text-emerald-400 font-bold">•</span>
          <span>${m}</span>
        </div>
      `).join('');

      document.getElementById('inspector').classList.remove('translate-x-full');
    }

    function closeInspector() {
      selectedNode = null;
      document.getElementById('inspector').classList.add('translate-x-full');
    }

    // 5. FILTERS & SEARCH
    function filterType(type) {
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('active', 'border-emerald-500/50', 'bg-emerald-500/20', 'text-emerald-300');
        b.classList.add('border-slate-700', 'bg-slate-800/80', 'text-slate-300');
      });
      const activeBtn = document.getElementById('btn-' + type);
      if (activeBtn) {
        activeBtn.classList.add('active', 'border-emerald-500/50', 'bg-emerald-500/20', 'text-emerald-300');
        activeBtn.classList.remove('border-slate-700', 'bg-slate-800/80', 'text-slate-300');
      }

      nodes.forEach(n => {
        n.visible = (type === 'all' || n.group === type);
      });
    }

    function handleSearch(term) {
      const q = term.toLowerCase().trim();
      nodes.forEach(n => {
        const match = n.label.toLowerCase().includes(q) || 
                      n.tech.toLowerCase().includes(q) || 
                      n.desc.toLowerCase().includes(q);
        n.visible = q === '' || match;
      });
    }

    function resetView() {
      camX = 0;
      camY = 0;
      zoom = 1.0;
    }

    function zoomBy(factor) {
      const centerX = width / 2;
      const centerY = height / 2;
      camX = centerX - (centerX - camX) * factor;
      camY = centerY - (centerY - camY) * factor;
      zoom *= factor;
      zoom = Math.max(0.3, Math.min(3.0, zoom));
    }

    function togglePhysics() {
      physicsRunning = !physicsRunning;
      const btn = document.getElementById('btnPhysics');
      btn.textContent = physicsRunning ? '⏸️ Фізика: Увімк' : '▶️ Фізика: Пауза';
      btn.classList.toggle('text-emerald-400', physicsRunning);
      btn.classList.toggle('text-amber-400', !physicsRunning);
    }
  </script>
</body>
