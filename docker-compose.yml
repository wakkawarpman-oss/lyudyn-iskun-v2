services:
  ai_worker:
    build: .
    command: celery -A worker.celery_app worker --loglevel=info -P gevent -c 50
    depends_on:
    - redis
    - db
    env_file: .env
    image: lyudyn-iskun-core:latest
    restart: unless-stopped
    volumes:
    - media_data:/app/media
    # The image's HEALTHCHECK curls the web_api's HTTP endpoint; this
    # service doesn't serve HTTP and would show as permanently unhealthy.
    healthcheck:
      test: ["NONE"]
  bot_ui:
    build: .
    command: python -m bot.main
    depends_on:
    - redis
    - db
    env_file: .env
    image: lyudyn-iskun-core:latest
    restart: unless-stopped
    healthcheck:
      test: ["NONE"]
  cloudflared:
    command: tunnel --url http://web_api:80
    depends_on:
    - web_api
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    volumes:
    - postgres_data:/var/lib/postgresql/data
  listener:
    build: .
    command: python -m listener.telethon_client
    depends_on:
    - redis
    env_file: .env
    image: lyudyn-iskun-core:latest
    restart: unless-stopped
    volumes:
    - media_data:/app/media
    healthcheck:
      test: ["NONE"]
  redis:
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
    - redis_data:/data
  web_api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 80
    depends_on:
    - db
    env_file: .env
    image: lyudyn-iskun-core:latest
    ports:
    - 80:80
    restart: unless-stopped
    volumes:
    - ./api:/app/api
volumes:
  media_data: null
  postgres_data: null
  redis_data: null
